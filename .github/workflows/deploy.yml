name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A71513: ${{ secrets.A71513 }}
          B38143: ${{ secrets.B38143 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A71513', '')
          tag_b = os.environ.get('B38143', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 03e8f19723f9c49cf90b53e38b63ded75e -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 902d394ba6c743ea5879f350bb054cc454ebe8a4 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
